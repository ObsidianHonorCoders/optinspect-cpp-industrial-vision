name: Build and Test

# Builds OptiInspect on a Windows runner using vcpkg to obtain OpenCV,
# GoogleTest and SQLite, then runs the full CTest suite (Phase 1 unit and
# integration tests plus the Phase 2 database tests, which use temporary
# databases only) and a short database CLI smoke test.
#
# Note on build time: installing OpenCV from source via vcpkg with the
# feature set used here (core,highgui,calib3d,png,jpeg) takes roughly
# 10-15 minutes on a cold cache, based on local development measurements.
# vcpkg's binary caching (enabled below) should make this much faster on
# subsequent runs once a cache entry exists.
#
# Note on network reliability: during local development on a corporate
# network, vcpkg's dependency downloads (e.g. nasm, used by libjpeg-turbo)
# occasionally failed TLS handshakes behind a corporate proxy and required
# manual workarounds. That issue was specific to the local corporate
# network/proxy configuration, not to the build itself; GitHub-hosted
# runners have direct internet access and should not hit the same problem,
# but this is not something that was possible to verify from this
# environment, so if this workflow fails on a GitHub runner for network
# reasons, that would be a new finding, not a known/expected issue.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-2022

    env:
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Export GitHub Actions cache variables for vcpkg
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Clone vcpkg
        run: git clone https://github.com/microsoft/vcpkg ${{ env.VCPKG_ROOT }}

      - name: Bootstrap vcpkg
        run: ${{ env.VCPKG_ROOT }}\bootstrap-vcpkg.bat

      - name: Install OpenCV, GoogleTest and SQLite via vcpkg
        # Deliberately a reduced OpenCV feature set: the default vcpkg
        # features pull in dnn/gapi -> abseil, which needs a newer compiler
        # toolset than this project targets and is unnecessary since this
        # is a traditional-CV-only (non-ML) project.
        run: |
          ${{ env.VCPKG_ROOT }}\vcpkg.exe install "opencv4[core,highgui,calib3d,png,jpeg]:x64-windows"
          ${{ env.VCPKG_ROOT }}\vcpkg.exe install "gtest:x64-windows"
          ${{ env.VCPKG_ROOT }}\vcpkg.exe install "sqlite3:x64-windows"

      - name: Configure (CMake)
        # Pin the runner image to one that provides the VS2022 generator.
        run: >
          cmake -S . -B build
          -G "Visual Studio 17 2022" -A x64
          -DCMAKE_TOOLCHAIN_FILE=${{ env.VCPKG_ROOT }}\scripts\buildsystems\vcpkg.cmake
          -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build (Release)
        run: cmake --build build --config Release -- /m

      - name: Run tests
        working-directory: build
        run: ctest -C Release --output-on-failure

      - name: Smoke-test the database CLI
        # Uses a throwaway database under RUNNER_TEMP, never a pre-existing one.
        # The inspection exit code is 0/1/2 (PASS/FAIL/REVIEW); anything else is an error.
        shell: pwsh
        run: |
          $exe = "build\bin\Release\optinspect.exe"
          $db = Join-Path $env:RUNNER_TEMP "ci_smoke.db"
          & $exe db init --database $db
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & $exe product create --database $db --code CI-001 --name "CI board"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & $exe inspect --reference data\samples\deeppcb\images\00041000_temp.jpg --input data\samples\deeppcb\images\00041000_test.jpg --output (Join-Path $env:RUNNER_TEMP "ci_out") --database $db --product-id 1
          if ($LASTEXITCODE -notin 0, 1, 2) { exit 1 }
          & $exe analytics summary --database $db
          if ($LASTEXITCODE -ne 0) { exit 1 }
          exit 0

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-logs
          path: build/Testing/Temporary/
